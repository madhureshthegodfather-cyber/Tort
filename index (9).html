<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d16"><meta name="color-scheme" content="dark">
<title>Clinic Fitness & Rehab Tracker – Prototype</title>
<style>
:root{color-scheme:dark;--bg:#090d16;--card:#111827;--ink:#e6edf5;--mute:#94a3b8;--line:rgba(255,255,255,.08);--acc:#06b6d4;--accbg:rgba(6,182,212,.14);--good:#10b981;--goodbg:rgba(16,185,129,.14);--bad:#f43f5e;--badbg:rgba(244,63,94,.14);--warn:#f59e0b;--warnbg:rgba(245,158,11,.14)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:76px}
header{padding:14px 16px 6px;max-width:900px;margin:0 auto}
header h1{font-size:18px;margin:0}header p{margin:2px 0 0;color:var(--mute);font-size:12.5px}
main{max-width:900px;margin:0 auto;padding:8px 16px}
nav button.on{color:var(--acc);font-weight:600;box-shadow:inset 0 2px 0 var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
h2{font-size:16px;margin:0 0 8px}h3{font-size:13px;margin:0 0 6px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:560px){.g2.stack{grid-template-columns:1fr}}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--accbg);color:var(--acc);white-space:nowrap}
.pill.good{background:var(--goodbg);color:var(--good)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.mute{background:var(--line);color:var(--mute)}
.big{font-size:34px;font-weight:700;line-height:1}
.mute{color:var(--mute)}.sm{font-size:12.5px}
button.b,.b{border:1px solid var(--acc);background:var(--acc);color:#fff;padding:8px 14px;border-radius:9px;font:inherit;font-size:14px;cursor:pointer}
button.b.alt{background:none;color:var(--acc)}button.b.sm{padding:4px 10px;font-size:12.5px}
label{display:block;font-size:12.5px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
input[type=range]{padding:0;accent-color:var(--acc)}
textarea{min-height:64px;resize:vertical}
.cl{cursor:pointer}.cl:hover{border-color:var(--acc)}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.alert{display:flex;gap:8px;padding:8px 10px;border-radius:9px;background:var(--badbg);color:var(--bad);margin:6px 0;font-size:13.5px}
.alert b{white-space:nowrap}
.tip{padding:8px 10px;border-radius:9px;background:var(--goodbg);color:var(--good);font-size:13.5px;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:600;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:4px 11px;border-radius:99px;font-size:13px;cursor:pointer}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
svg text{fill:var(--mute);font-size:9px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13.5px;z-index:9}
.ddb{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--acc);border-radius:9px;padding:10px 12px;font:inherit;cursor:pointer}
.ddl{border:1px solid var(--line);border-radius:9px;max-height:260px;overflow:auto;margin-top:6px;background:var(--card)}
.ddr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}.ddr:hover{background:var(--accbg)}
.scroll{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}.scroll .chip{white-space:nowrap}
.b.rec{background:#b3261e;animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.7}}
.cv{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(#0b0f19,#151e30);box-shadow:inset 0 0 0 1px #1f2b45}
.cv canvas{display:block;width:100%;aspect-ratio:1/1.15;touch-action:pan-y;cursor:grab;background:transparent}
.blabel{position:absolute;left:0;right:0;bottom:10px;text-align:center;font:600 14px system-ui,sans-serif;letter-spacing:.02em;color:#cfe9ff;text-shadow:0 1px 8px #000;pointer-events:none}
.note{font-size:12px;color:var(--mute);margin-top:10px}
@media print{header,.noprint,button,.toast{display:none!important}body{background:#fff!important;color:#000!important;padding:0!important;font-size:12px}main{max-width:none;padding:0}.card{border:1px solid #999!important;break-inside:avoid;box-shadow:none}.alert{border:1px solid #c4372c;background:#fff!important;color:#c4372c!important}.tip{background:#fff!important;color:#000!important;border:1px solid #1c8a4a}.printonly{display:block!important}}
.printonly{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--mute);margin:8px 2px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.stp{display:flex;align-items:center;gap:6px}.stp b{flex:1;text-align:center;font-size:24px;min-width:44px}
.stp button{width:56px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:28px;line-height:1;cursor:pointer;touch-action:manipulation}
.stp button:active{background:var(--accbg)}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.rings .rg{cursor:pointer}
.rings .rl{font-size:11.5px;color:var(--mute);margin-top:2px}
.tgt{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.tgt:first-of-type{border-top:0}
.tgt i{width:12px;height:12px;border-radius:50%;flex:none}
.ub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12.5px;color:var(--mute);margin-top:6px}.ub b{color:var(--ink)}
.authc{max-width:420px;margin:18px auto}.amsg{min-height:20px;font-size:13px;margin:8px 0;color:var(--mute)}.amsg.bad{color:var(--bad)}.amsg.ok{color:var(--good)}
.plr{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.plr:first-of-type{border-top:0}
.plr.done b{color:var(--good)}.plr.over{box-shadow:inset 3px 0 0 var(--warn,#e0a100);padding-left:8px}.plr.flag{box-shadow:inset 3px 0 0 var(--bad);padding-left:8px}
.plc{display:flex;gap:6px;align-items:center;flex:none}.plc .b{min-width:64px}
.pld{display:flex;align-items:center;justify-content:space-between;margin:14px 0 2px}.pld h3{margin:0}
.pfm{padding:8px 0 4px}.pfm .stp b{font-size:20px}.pfm .stp button{height:42px;width:48px;font-size:22px}
.logo{letter-spacing:.08em;font-size:15px}#topbar{position:sticky;top:0;z-index:7;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)}
#topbar .who{flex:1;min-width:0;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#topbar #sbbadge{margin-left:auto;flex:none}
#menubtn{border:1px solid var(--line);background:none;color:var(--ink);border-radius:10px;font-size:20px;line-height:1;width:42px;height:38px;cursor:pointer}
.dov{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}.dov.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(86vw,340px);background:var(--card);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .22s;z-index:21;overflow-y:auto;}.drawer.open{transform:none;box-shadow:-8px 0 30px #0004}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}.dh .mx{border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer;padding:4px 8px}.dl{padding:12px 14px}
.mi{display:block;width:100%;text-align:left;padding:13px 12px;margin:0 0 8px;border:1px solid var(--line);border-radius:12px;background:none;color:var(--ink);font:inherit;cursor:pointer}.mi:disabled{opacity:.45;cursor:default}.mi.cur{border-color:var(--acc);background:var(--accbg)}.mi.out{color:var(--bad);margin-top:14px}
.pind{display:flex;justify-content:center;gap:14px;margin:16px 0 4px}.pind i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mute)}.pind i.on{background:var(--acc);border-color:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:8px auto 0}.pad button{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;cursor:pointer;touch-action:manipulation}.pad button:active{background:var(--accbg)}
.dcr{margin-top:8px}.dcb .chip{font-size:12.5px;padding:6px 10px}

.modal{position:fixed;inset:0;background:#000a;z-index:30;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}
.modal>.mbox{background:var(--card);color:var(--ink);width:min(100%,560px);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,#0b1830,#143a5c);color:#e8f4ff;border:1px solid #1f3b5e}.hero .mute{color:#9fc3e6}
.flame{text-align:center;background:#2a1405;border:1px solid #ff9f1c;border-radius:16px;padding:8px 14px;color:#ffb347;box-shadow:0 0 18px #ff9f1c55}.flame b{display:block;font-size:26px;line-height:1}.flame span{font-size:11px}
.stat{background:#ffffff14;border-radius:12px;padding:8px 14px;min-width:96px}.stat b{display:block;font-size:26px}.stat span{font-size:11.5px;color:#b9d6ee}.stat.bad{background:#b3261e55}
.cta{display:block;width:100%;min-height:56px;font-size:17px;margin:10px 0}
.big48{min-height:48px;min-width:48px;font-size:15px}.full{width:100%}
.ob{width:60px;height:56px;border-radius:14px;border:2px solid;font-size:26px;font-weight:700;color:#fff;cursor:pointer;line-height:1}
.ob.ok{background:#0e9aa7;border-color:#12c5d4;box-shadow:0 0 12px #12c5d466}
.ob.up{background:#0f9d58;border-color:#2cff9b;box-shadow:0 0 16px #2cff9bbb}
.ob.dn{background:#c4122f;border-color:#ff4d6a;box-shadow:0 0 16px #ff4d6abb}
.ob:active{transform:scale(.94)}
.tmr{text-align:center;margin:10px 0}.tmv{font:700 40px ui-monospace,monospace;letter-spacing:.04em}.tmv.run{color:var(--good)}
.rl{display:flex;flex-wrap:wrap;gap:6px}.rl button{width:44px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.vpin{position:sticky;bottom:64px;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-top:12px;box-shadow:0 -4px 16px #0004}
.ph .plr{border-top:1px solid var(--line)}
.stat,.grid{}
.pdoc{display:none}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto}
@media print{#report>*:not(.pdoc){display:none!important}body[data-pm=staff] #ps-staff,body[data-pm=member] #ps-member{display:block!important}
.pd-h{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}.pd-t{width:100%;border-collapse:collapse;margin:6px 0}.pd-t td,.pd-t th{border:1px solid #444;padding:4px 6px;text-align:left;font-size:11.5px}
.pdoc h3{margin:10px 0 2px;font-size:13px;border-bottom:1px solid #888}.pd-sig{display:flex;justify-content:space-between;margin-top:30px}
.pm-card{max-width:420px;margin:0 auto;border:2px solid #0b3a5c;border-radius:18px;overflow:hidden;font-family:system-ui,sans-serif}.pm-top{display:flex;justify-content:space-between;background:#0b3a5c;color:#fff!important;padding:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pm-fl{text-align:center}.pm-fl b{display:block;font-size:22px}.pm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}.pm-tile{border:1px solid #bbb;border-radius:10px;padding:8px}.pm-k{font-size:11px;color:#555}.pm-v{font-size:20px;font-weight:700}.pm-d{font-size:11px}.pm-d.good{color:#0a7a3d}.pm-d.bad{color:#b3261e}
.pm-row{display:flex;justify-content:space-around;padding:8px;font-size:12px;border-top:1px solid #ddd}.pm-foot{padding:10px;font-size:12px;background:#eef6fb;-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* ===== v18 dark studio polish ===== */
body{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;background:var(--bg)}
.card{padding:18px;border-radius:16px;box-shadow:none}
.card .card{border-radius:14px}
button.b,.b{background:var(--acc);border-color:var(--acc);color:#031a20;font-weight:600;min-height:48px;padding:10px 18px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.b.alt,.b.alt{background:transparent;color:var(--acc);border-color:rgba(6,182,212,.45)}
button.b.sm,.b.sm{min-height:48px;padding:8px 14px;font-size:13.5px}

.b.rec{color:#fff}
.chip{min-height:48px;display:inline-flex;align-items:center;padding:0 16px;border-radius:99px}

nav button{min-height:56px}
input,select,textarea{min-height:48px;border-radius:12px;background:#0b1220}
textarea{min-height:64px}
.mi{min-height:52px;border-radius:14px}
#menubtn{width:48px;height:48px;border-radius:14px}
.mx{min-width:48px;min-height:48px}
.dh .mx,.pad button{min-height:48px}
.stp button{min-width:56px;min-height:52px}
.stp b,.tmv,.big,.stat b,.flame b,.pm-v,.rl button,table td,table th{font-variant-numeric:tabular-nums}
.cv{background:radial-gradient(ellipse at 50% 38%,#111b2e 0%,#0a1020 55%,#090d16 100%);box-shadow:none;border-radius:14px}

.pill{background:var(--accbg)}

.ob{min-width:56px;min-height:56px}
.alert{border-radius:14px}
h3{letter-spacing:.06em}
/* share card */

.sc-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative}

@media print{body[data-pm=card]{background:#fff!important}body[data-pm=card] #app,body[data-pm=card] #topbar,body[data-pm=card] header,body[data-pm=card] #drawer,body[data-pm=card] #dov{display:none!important}

header{display:none}
.floorwrap{position:sticky;top:64px;z-index:6;background:rgba(9,13,22,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:6px 12px}
.fl-t{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.fl-r{display:flex;gap:10px;overflow-x:auto;padding:2px 0}

.chk{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 0;border-top:1px solid var(--line);font-size:15px;color:var(--ink);margin:0}.chk input{width:22px;height:22px;min-height:0;flex:none}

  const r=rng(spec.seed),s=[];let k=0;
  for(let w=0;w<8;w++)for(const o of [0,2,4]){
    if(spec.skip&&spec.skip(w,o))continue;
    const kk=w*3+[0,2,4].indexOf(o),t=kk/23,n=r();
    const rm=kk%4==3;
    s.push({d:w*7+o,ex:spec.primary,sets:3,reps:spec.reps,
      load:Math.round(spec.load(kk,t,n)*2)/2,
      ease:clamp(Math.round(spec.ease(kk,t,n)),1,10),
      form:clamp(Math.round(spec.form(kk,t,n)*2)/2,1,4),
      pain:clamp(Math.round(spec.pain(kk,t,n)),0,10),
      rom:rm?Math.round(spec.rom(kk,t,n)):null});
  }

}

function metrics(c,ss){
  const p=ss.filter(x=>x.ex==c.primary),rm=ss.filter(x=>x.rom!=null);
  return{e1:avg(p.map(e1)),form:avg(ss.map(x=>x.form)),pain:avg(ss.map(x=>x.pain)),ease:avg(ss.map(x=>x.ease)),rom:avg(rm.map(x=>x.rom)),adh:Math.min(1,new Set(ss.map(x=>x.d)).size/6)};
}
function domains(c,end){
  const b=metrics(c,wsel(c,0,13)),u=metrics(c,wsel(c,end-13,end));
  if(!b.adh||end<=13)return null;
  const rel=(a,z)=>a==null||z==null?50:clamp(50+(a/z-1)*250,0,100);
  const diff=(a,z,k,sg)=>a==null||z==null?50:clamp(50+sg*(a-z)*k,0,100);
  return{b,u,sc:{Strength:rel(u.e1,b.e1),'Range of motion':rel(u.rom,b.rom),'Form quality':diff(u.form,b.form,50/1.5,1),Pain:diff(u.pain,b.pain,50/3,-1),Ease:diff(u.ease,b.ease,50/3,-1),Adherence:clamp(u.adh*100,0,100)}};
}

  if(c.s.length<6)return null;
  const d=domains(c,end);if(!d)return null;

function alerts(c){
  const A=[],s=[...c.s].sort((a,b)=>a.d-b.d);

  if(p.length>=3){const l=p[p.length-1],prev=p.filter(x=>x!==l&&x.d>=l.d-28);
    if(prev.length){const best=Math.max(...prev.map(e1));if(e1(l)<=best*.9)A.push(['Strength drop','Estimated 1RM '+e1(l).toFixed(1)+' kg vs best '+best.toFixed(1)+' kg in the last 4 weeks'])}}
  if(s.length>=3){const [a,b,z]=s.slice(-3).map(x=>x.pain);if(z>b&&b>a&&z-a>=2)A.push(['Pain rising','Pain '+a+' → '+b+' → '+z+' over the last 3 visits'])}
  const r=s.filter(x=>x.rom!=null);
  if(r.length>=2){const l=r[r.length-1],q=r[r.length-2];if(q.rom-l.rom>=5)A.push(['ROM loss','Range fell '+q.rom+'° → '+l.rom+'° since last measure'])}
  if(s.length>=3){const [a,b,z]=s.slice(-3).map(x=>x.form);if(z<b&&b<a)A.push(['Form decline','Form score '+a+' → '+b+' → '+z+' over the last 3 sessions'])}
  if(s.length>=6){const n=new Set(wsel(c,NOW-13,NOW).map(x=>x.d)).size;if(n/6<.6)A.push(['Drop-off','Only '+n+' of 6 prescribed sessions in the last 2 weeks'])}
  const i1=index(c,NOW),i0=index(c,NOW-14);
  if(i1!=null&&i0!=null&&i1-i0<=-10)A.push(['Overall regression','Progress Index fell from '+i0+' to '+i1+' in 2 weeks']);
  return A;
}

  t=t.replace(/(\d+)\s*point\s*(\d)/g,'$1.$2');
  const r={},num='(\\d+(?:\\.\\d+)?)';
  const c=clients.find(c=>c.name.toLowerCase().split(' ').some(w=>w.length>2&&t.includes(' '+w+' ')));
  if(c)r.cid=c.id;
  let best=null,bs=0;
  for(const e of exs){const ws=e.name.toLowerCase().replace(/[^a-z ]/g,' ').split(' ').filter(w=>w.length>2);
    const hit=ws.filter(w=>t.includes(w.replace(/s$/,''))).length,sc=ws.length?hit/ws.length+ws.length*.01:0;
    if(hit&&sc>bs){bs=sc;best=e}}
  if(best&&bs>=.5)r.ex=best.id;
  let m;
  if(m=t.match(new RegExp(num+' sets? (?:of|x|×) '+num))){r.sets=+m[1];r.reps=+m[2]}
  else if(m=t.match(new RegExp(num+' ?(?:x|×|by) ?'+num+'(?! ?(?:kg|kilo|degree))'))){r.sets=+m[1];r.reps=+m[2]}
  else{if(m=t.match(new RegExp(num+' reps?')))r.reps=+m[1];if(m=t.match(new RegExp(num+' sets?')))r.sets=+m[1]}
  if(m=t.match(new RegExp(num+' ?(?:kg|kgs|kilos?|kilograms?|கிலோ)')))r.load=+m[1];
  else if(m=t.match(new RegExp(num+' ?(?:lbs?|pounds?)')))r.load=Math.round(m[1]*.4536*2)/2;
  if(m=t.match(new RegExp('(?:ease|effort|rpe) (?:was |is |of |at )?'+num)))r.ease=clamp(Math.round(+m[1]),1,10);
  else if(/\b(felt|was|very) (really )?(easy|light)\b/.test(t))r.ease=3;
  else if(/\b(felt|was|very) (moderate|okay|ok)\b/.test(t))r.ease=5;
  else if(/\b(felt|was|very) (really )?(hard|heavy|difficult|tough)\b|kashtam|kastam|கஷ்டம்/.test(t))r.ease=8;
  else if(/easya|ஈசி/.test(t))r.ease=3;
  if(/no pain|pain free|pain-free|vali illa|வலி இல்ல/.test(t))r.pain=0;
  else if(m=t.match(new RegExp('(?:pain|vali|வலி) (?:was |is |of |at |level )?'+num)))r.pain=clamp(Math.round(+m[1]),0,10);
  if(m=t.match(/form (?:was |is |score )?([1-4])\b/))r.form=+m[1];
  else if(/\b(clean|perfect|excellent)\b|semma|சூப்பர்/.test(t))r.form=4;
  else if(/\b(good|minor)\b|nalla|நல்ல/.test(t))r.form=3;
  else if(/\b(poor|major|sloppy|bad)\b|sariya illa|சரியில்ல/.test(t))r.form=2;
  else if(/unsafe|dangerous/.test(t))r.form=1;
  if(m=t.match(new RegExp(num+' ?(?:degrees?|டிகிரி|°)')))r.rom=Math.round(+m[1]);
  return r;
}
function buildSheet(c){
  const s=[...c.s].sort((a,b)=>a.d-b.d),L=s[s.length-1];
  if(!L)return{S:'',O:'',A:'',P:'',date:null};
  const P=s.slice(0,-1).reverse().find(x=>x.ex==L.ex),e=ex(L.ex);
  const dl=(a,b,u)=>{const d=Math.round((a-b)*10)/10;return(d>0?'+':'')+d+u};
  let O=e.name+': '+L.sets+'×'+L.reps+(L.load?' @ '+L.load+' kg':'')+' (est. 1RM '+e1(L).toFixed(1)+' kg'+(P?', '+dl(e1(L),e1(P),' kg')+' vs previous session':'')+'). Form '+L.form+'/4, effort '+L.ease+'/10, pain '+L.pain+'/10.';
  if(L.rom!=null){const q=s.filter(x=>x.rom!=null&&x!==L).pop();O+=' ROM '+L.rom+'°'+(q?' ('+dl(L.rom,q.rom,'°')+' vs last measure)':'')+'.'}
  const m=metrics(c,wsel(c,NOW-13,NOW));
  O+=' Last 2 weeks: avg pain '+(m.pain??0).toFixed(1)+'/10, avg form '+(m.form??0).toFixed(1)+'/4, adherence '+Math.round(m.adh*100)+'%.';
  const Sj=L.notes?'Client reports: '+L.notes:'Pain recorded at '+L.pain+'/10 with '+e.name.toLowerCase()+', effort '+L.ease+'/10. (Add anything the client told you.)';
  const st=status(c),al=alerts(c),tol=L.pain<=2&&L.form>=3&&L.ease<=7;
  let A=(tol?'Session tolerated well with good control. ':L.pain>=5?'High pain response to this session. ':'Session tolerated with some difficulty. ');
  if(P)A+=e1(L)>e1(P)*1.02?'Strength up on the last session. ':e1(L)<e1(P)*.95?'Strength down on the last session. ':'Strength steady. ';
  if(st.i!=null)A+='Progress Index '+st.i+' ('+st.t+'). ';
  A+=al.map(a=>a[0]+': '+a[1]+'. ').join('');
  let Pl;
  if(al.some(a=>a[0]=='Pain rising')||L.pain>=6)Pl='Reduce load by 10–20%'+(e.reg?' or regress to '+ex(e.reg).name:'')+'. Re-check pain at the next visit and consider re-assessment.';
  else if(al.length)Pl='Review flagged items ('+al.map(a=>a[0]).join(', ')+') with the client and adjust the programme.';
  else if(suggestion(c)&&L.ex==c.primary)Pl=suggestion(c);
  else if(tol)Pl='Continue. Increase load 2.5–5% next session if form and pain stay the same.';
  else Pl='Hold the current load, cue form, and review again next session.';
  const wl=wellLines(c);
  return{S:Sj+wl.S,O:O+wl.O,A:(A.trim()+wl.A).trim(),P:Pl+wl.P,date:L.d};
}

function chart(title,pts,o={}){
  if(pts.length<2)return '<div class="card"><h3>'+title+'</h3><div class="mute sm">Not enough data yet</div></div>';
  const W=300,H=110,L=26,B=16,T=8,R=8;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const x0=Math.min(...xs),x1=Math.max(...xs);let y0=Math.min(...ys),y1=Math.max(...ys);
  if(y1-y0<1){y0-=1;y1+=1}const pad=(y1-y0)*.15;y0-=pad;y1+=pad;
  const X=x=>L+(x-x0)/((x1-x0)||1)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  const d=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const last=pts[pts.length-1],first=pts[0];
  const better=o.low?last.y<first.y:last.y>first.y,flat=Math.abs(last.y-first.y)<(y1-y0)*.05;
  const col=flat?'var(--mute)':better?'var(--good)':'var(--bad)';
  return '<div class="card"><div class="row"><h3>'+title+'</h3><span class="sm" style="color:'+col+'">'+last.y.toFixed(o.dp??0)+(o.unit||'')+'</span></div>'+
  '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+title+' trend">'+
  '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" stroke="var(--line)"/>'+
  '<text x="2" y="'+(T+6)+'">'+(y1-pad).toFixed(o.dp??0)+'</text><text x="2" y="'+(H-B)+'">'+(y0+pad).toFixed(o.dp??0)+'</text>'+
  '<text x="'+L+'" y="'+(H-3)+'">'+(o.xl?o.xl(first.x):fmt(first.x))+'</text><text x="'+(W-R)+'" y="'+(H-3)+'" text-anchor="end">'+(o.xl?o.xl(last.x):fmt(last.x))+'</text>'+
  '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round"/>'+
  pts.map(p=>'<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="2.4" fill="'+col+'"/>').join('')+'</svg></div>';
}

function readiness(c){
  const t=dayRec(c,NOW)||dayRec(c,NOW-1);if(!t)return null;
  const sc=clamp((t.sleep-4)/4,0,1)*35+clamp(t.energy/10,0,1)*20+(1-clamp((t.stress-1)/9,0,1))*20+(1-clamp(t.sore/10,0,1))*25;
  const v=Math.round(sc);
  return v>=70?{v,cls:'good',t:'Train as planned',why:'Sleep, energy and soreness look good.',adj:0}:v>=45?{v,cls:'warn',t:'Reduce load or volume about 10%',why:'Recovery is a little low. Keep the form strict and stop sets early if pain rises.',adj:-.1}:{v,cls:'bad',t:'Light mobility and technique only',why:'Recovery is low today. A hard session is more likely to hurt than help.',adj:-.25,date:t.d};
}
// ---- calibration
function calib(c){
  const ses=c.s.length,chk=c.days.filter(x=>x.d>=NOW-28).length,rom=c.s.filter(x=>x.rom!=null).length;
  const need=[];if(ses<6)need.push((6-ses)+' more logged sessions');if(chk<10)need.push((10-chk)+' more daily check-ins');if(rom<2)need.push((2-rom)+' range-of-motion measures');
  const pct=Math.round((Math.min(ses,6)/6+Math.min(chk,10)/10+Math.min(rom,2)/2)/3*100);
  return{ok:!need.length,pct,need};
}
// ---- insights: associations between daily habits and session outcomes
const FACT=[
 {k:'sleep',src:'a',n:'sleep the night before',u:' h',good:'high',dp:1},
 {k:'stress',src:'a',n:'stress on the day',u:'/10',good:'low',dp:1},
 {k:'sore',src:'a',n:'soreness on the day',u:'/10',good:'low',dp:1},
 {k:'breaks',src:'b',n:'stretch breaks the day before',u:'',good:'high',dp:1},
 {k:'desk',src:'b',n:'sitting hours the day before',u:' h',good:'low',dp:1},
 {k:'protein',src:'b',n:'protein the day before',u:' g',good:'high',dp:0},
 {k:'water',src:'b',n:'water the day before',u:' glasses',good:'high',dp:1},
 {k:'steps',src:'b',n:'steps the day before',u:'',good:'high',dp:0}];
const OUT=[{k:'pain',n:'pain',better:'low'},{k:'ease',n:'effort felt',better:'low'},{k:'form',n:'form score',better:'high'}];
function corr(x,y){const n=x.length,mx=avg(x),my=avg(y);let a=0,b=0,c2=0;for(let i=0;i<n;i++){a+=(x[i]-mx)*(y[i]-my);b+=(x[i]-mx)**2;c2+=(y[i]-my)**2}return b&&c2?a/Math.sqrt(b*c2):0}
function insights(c){
  const by={};c.days.forEach(x=>by[x.d]=x);
  const P=c.s.map(s=>({s,a:by[s.d],b:by[s.d-1]})).filter(p=>p.a&&p.b);
  if(P.length<10)return{n:P.length,works:[],watch:[],note:'Needs at least 10 sessions with daily check-ins before patterns can be shown.'};
  const F=[];
  for(const f of FACT){const xs=P.map(p=>p[f.src][f.k]);if(new Set(xs).size<3)continue;
    const med=[...xs].sort((a,b)=>a-b)[Math.floor(xs.length/2)];
    for(const o of OUT){const ys=P.map(p=>p.s[o.k]),r=corr(xs,ys);if(Math.abs(r)<.35)continue;
      const hi=P.filter((p,i)=>xs[i]>med),lo=P.filter((p,i)=>xs[i]<=med);if(hi.length<3||lo.length<3)continue;
      const mh=avg(hi.map(p=>p.s[o.k])),ml=avg(lo.map(p=>p.s[o.k]));
      const hiBetter=o.better=='low'?mh<ml:mh>ml,goodLevel=hiBetter?'high':'low';
      const cur=lastN(c,14,f.k),curHigh=cur>med;
      F.push({f,o,r,n:P.length,med,mh,ml,hiBetter,onGood:(curHigh&&hiBetter)||(!curHigh&&!hiBetter),cur,healthy:goodLevel==f.good,goodMean:hiBetter?mh:ml,badMean:hiBetter?ml:mh,goodLevel});
    }}
  F.sort((a,b)=>Math.abs(b.r)-Math.abs(a.r));
  const txt=x=>{const lvl=x.goodLevel=='high'?'higher':'lower',bad=x.goodLevel=='high'?'lower':'higher';
    return {good:'When '+x.f.n+' was '+lvl+' (around the '+(x.goodLevel=='high'?'upper':'lower')+' half, '+x.med.toFixed(x.f.dp)+x.f.u+' is the midpoint), '+x.o.n+' averaged '+x.goodMean.toFixed(1)+' compared with '+x.badMean.toFixed(1)+'.',
            bad:'When '+x.f.n+' was '+bad+', '+x.o.n+' averaged '+x.badMean.toFixed(1)+' compared with '+x.goodMean.toFixed(1)+'. Your last 14 days average '+(x.cur==null?'n/a':x.cur.toFixed(x.f.dp)+x.f.u)+'.'}};
  const seen=new Set(),works=[],watch=[];
  for(const x of F){const key=x.f.k;if(seen.has(key))continue;seen.add(key);const t=txt(x);(x.onGood?works:watch).push({...x,txt:x.onGood?t.good:t.bad})}
  return{n:P.length,works:works.slice(0,4),watch:watch.slice(0,4),note:'These are patterns in this person’s own logs, not proof of cause. Use them as prompts for a conversation.'};
}
// ---- exercise effectiveness
function exEff(c){
  const g={};c.s.forEach(x=>(g[x.ex]=g[x.ex]||[]).push(x));
  return Object.keys(g).map(id=>{const a=g[id].sort((p,q)=>p.d-q.d);if(a.length<3)return null;
    const h=Math.max(1,Math.floor(a.length/3)),f0=a.slice(0,h),f1=a.slice(-h);
    const st=a[0].load?(avg(f1.map(e1))/avg(f0.map(e1))-1)*100:null;
    const pain=avg(a.map(x=>x.pain)),form=avg(a.map(x=>x.form)),dp=avg(f1.map(x=>x.pain))-avg(f0.map(x=>x.pain));
    let v='steady';if((st!=null&&st>=8&&dp<=0.5)||(st==null&&dp<=-1))v='working';if(dp>=1.5||pain>=5||(st!=null&&st<=-8))v='not working';
    return{id:+id,n:a.length,st,pain,form,dp,v};}).filter(Boolean);
}
// ---- strengths and weaknesses
function swot(c){
  const dm=domains(c,NOW),S1=[],W1=[];
  if(dm)for(const k of Object.keys(WEIGHTS)){const v=dm.sc[k];if(v>=62)S1.push(k+' has improved well since the start');else if(v<=42)W1.push(k+' has got worse since the start')}
  const cut=NOW-28,tr={};c.s.filter(x=>x.d>=cut).forEach(x=>ex(x.ex).muscles.forEach(m=>tr[m]=(tr[m]||0)+1));
  const gap=Object.keys(MUSC).filter(m=>!tr[m]);
  if(gap.length)W1.push('Not trained in the last 4 weeks: '+gap.map(m=>MUSC[m].n.split(' (')[0].toLowerCase()).slice(0,8).join(', ')+(gap.length>8?' and others':''));
  const sl=lastN(c,14,'sleep'),pr=lastN(c,14,'protein'),st=lastN(c,14,'steps'),br=lastN(c,14,'breaks');
  if(sl!=null){if(sl>=7)S1.push('Sleep averages '+sl.toFixed(1)+' h');else if(sl<6.5)W1.push('Sleep averages only '+sl.toFixed(1)+' h')}
  if(pr!=null){if(pr>=protTarget(c)*.9)S1.push('Protein is close to target');else if(pr<protTarget(c)*.75)W1.push('Protein averages '+Math.round(pr)+' g against a target near '+protTarget(c)+' g')}
  if(st!=null&&st>=7500)S1.push('Active day to day ('+Math.round(st)+' steps)');else if(st!=null&&st<4500)W1.push('Low daily movement ('+Math.round(st)+' steps)');
  const iv=JOBT[c.job.type].iv,need=Math.max(1,Math.round(c.job.hrs*60/iv/2));
  if(br!=null&&br<need*.6&&['Desk','Driving','Standing'].includes(c.job.type))W1.push('About '+br.toFixed(1)+' stretch breaks a day against roughly '+need+' that suit this job');
  return{S:S1,W:W1};
}
// ---- suggestions
function stretchRoutine(c){return STRETCH.filter(s=>s.tag.includes(c.job.type)).slice(0,5)}
function suggestions(c){
  const out=[],cb=calib(c),A=alerts(c),ins=insights(c),eff=exEff(c);
  if(c.med.flags.length)out.push(['Safety','Red-flag symptom reported ('+c.med.flags.join('; ').toLowerCase()+'). Ask the client to see a doctor before progressing load.']);
  if(!cb.ok)out.push(['Calibration','Still calibrating (needs '+cb.need.join(', ')+'). Suggestions below are general until the baseline is complete.']);
  const L=c.s[c.s.length-1],rd=readiness(c);
  if(L){
    if(A.some(a=>a[0]=='Pain rising'||a[0]=='Strength drop'||a[0]=='Overall regression'))out.push(['Training','Pain or strength has moved the wrong way. Cut load 10–20%, keep the same exercise, and review at the next visit.']);
    else if(L.pain<=2&&L.form>=3&&L.ease<=7&&L.load)out.push(['Training','Next session on '+ex(L.ex).name+': try '+(Math.round(L.load*1.04*2)/2)+' kg for '+L.sets+'×'+L.reps+' (about +4%). Hold it if form slips.']);
  }
  eff.filter(e=>e.v=='not working').forEach(e=>out.push(['Training',ex(e.id).name+' has not been working (pain averaging '+e.pain.toFixed(1)+', strength '+(e.st==null?'n/a':(e.st>0?'+':'')+e.st.toFixed(0)+'%')+'). Swap in an easier variation.']));
  eff.filter(e=>e.v=='working').forEach(e=>out.push(['Training',ex(e.id).name+' is working'+(e.st!=null?' (strength '+(e.st>0?'+':'')+e.st.toFixed(0)+'%)':'')+'. Keep it in the programme.']));
  if(rd&&rd.adj<0)out.push(['Today',rd.t+'. '+rd.why]);
  ins.watch.slice(0,2).forEach(w=>out.push(['Habits',w.txt]));
  const sl=lastN(c,14,'sleep');if(sl!=null&&sl<6.5&&!ins.watch.some(w=>w.f.k=='sleep'))out.push(['Recovery','Sleep averages '+sl.toFixed(1)+' h. Aim for 7–8 h and avoid hard sessions after nights under 6 h.']);
  const br=lastN(c,14,'breaks'),iv=JOBT[c.job.type].iv;
  if(['Desk','Driving','Standing'].includes(c.job.type)&&br!=null&&br<3)out.push(['Work','Set a reminder every '+iv+' minutes for a 2–3 minute break: '+stretchRoutine(c).slice(0,3).map(s=>s.n.toLowerCase()).join(', ')+'.']);
  const pr=lastN(c,14,'protein');if(pr!=null&&pr<protTarget(c)*.8)out.push(['Diet','Protein averages '+Math.round(pr)+' g against a target near '+protTarget(c)+' g. Adding eggs, dal, curd, paneer or sundal at one or two meals can close most of the gap.']);
  const wt=lastN(c,14,'water');if(wt!=null&&wt<waterTarget(c)*.7)out.push(['Diet','Water averages '+wt.toFixed(1)+' glasses against about '+waterTarget(c)+'. Keep a bottle at the desk or workstation.']);
  return out;
}
// ---- add wellness text to auto case sheet
function wellLines(c){
  if(!c.days)return{S:'',O:'',A:'',P:''};
  const sl=lastN(c,14,'sleep'),st=lastN(c,14,'stress'),pr=lastN(c,14,'protein'),br=lastN(c,14,'breaks'),sp=lastN(c,14,'steps'),ins=insights(c),sg=suggestions(c).filter(x=>['Habits','Work','Diet','Recovery','Safety'].includes(x[0]));
  const f=(v,d)=>v==null?'n/a':v.toFixed(d);
  return{
   S:' Check-ins (last 2 weeks): sleep '+f(sl,1)+' h, stress '+f(st,1)+'/10, steps '+(sp==null?'n/a':Math.round(sp))+', protein '+(pr==null?'n/a':Math.round(pr))+' g, stretch breaks '+f(br,1)+'/day. Work: '+(c.job.title||'not recorded')+', '+c.job.type.toLowerCase()+', '+c.job.hrs+' h.',
   O:c.med.contra?' Precautions on file: '+c.med.contra:'',
   A:(c.med.flags.length?' Red flag on file: '+c.med.flags.join('; ').toLowerCase()+'.':'')+(ins.watch[0]?' Pattern to watch: '+ins.watch[0].txt:''),
   P:sg.length?' Lifestyle: '+sg.slice(0,2).map(x=>x[1]).join(' '):''};
}

function micToggle(){
  const m=$('#vmsg'),btn=$('#mic');

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){micFallback('Live voice capture is not available in this viewer.');return}
  try{
    const r=new SR();r.lang=($('#vlang')||{}).value||'en-IN';r.continuous=true;r.interimResults=true;HELD='';
    r.onstart=()=>{btn.textContent='■ Listening… tap to stop';btn.classList.add('rec');m.textContent='Listening. Speak now, tap again when done.'};
    r.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript+' ';HELD=s.trim();$('#vtext').value=HELD};
    r.onerror=e=>{REC=null;btn.textContent='🎤 Tap to speak';btn.classList.remove('rec');
      if(e.error=='not-allowed'||e.error=='service-not-allowed')micFallback('The microphone is blocked here (permission denied by this viewer).');
      else if(e.error=='no-speech')m.textContent='Did not hear anything. Move closer to the mic and tap again.';
      else if(e.error=='network')micFallback('Speech recognition needs an internet connection.');

async function noiseCheck(){
  const m=$('#vnoise');
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false}});
    const ac=new (window.AudioContext||window.webkitAudioContext)(),an=ac.createAnalyser();an.fftSize=2048;ac.createMediaStreamSource(st).connect(an);
    const buf=new Float32Array(an.fftSize);let sum=0,n=0;m.textContent='Measuring for 3 seconds…';
    await new Promise(res=>{const t0=Date.now(),iv=setInterval(()=>{an.getFloatTimeDomainData(buf);let q=0;for(const v of buf)q+=v*v;sum+=20*Math.log10(Math.sqrt(q/buf.length)||1e-6);n++;if(Date.now()-t0>3000){clearInterval(iv);res()}},100)});
    st.getTracks().forEach(t=>t.stop());ac.close();
    const db=sum/n;
    m.textContent=db<-50?'Quiet ('+db.toFixed(0)+' dB). Voice entry should work well.':db<-35?'Busy ('+db.toFixed(0)+' dB). Use a headset mic and speak close to it.':'Very loud ('+db.toFixed(0)+' dB). Use a headset or clip-on mic, or type this entry.';
  }catch(err){m.textContent='Cannot reach the microphone here (blocked in this preview). In the live app this will report the floor noise level.'}
}

const win=(c,a,b)=>c.s.filter(x=>x.d>=a&&x.d<=b);
function kpis(c){
  const cur=win(c,NOW-6,NOW),pri=win(c,NOW-13,NOW-7);
  const vol=a=>a.reduce((p,x)=>p+x.sets*x.reps*(x.load||0),0),rp=a=>a.reduce((p,x)=>p+x.sets*x.reps,0);
  const useReps=vol(cur)+vol(pri)==0,V1=useReps?rp(cur):vol(cur),V0=useReps?rp(pri):vol(pri);
  const K={cur,pri,vol:{v1:V1,v0:V0,unit:useReps?'total reps (bodyweight work)':'kg (sets × reps × load)',pct:V0?(V1/V0-1)*100:null}};
  const lifts={};[...cur,...pri].filter(x=>x.load>0).forEach(x=>(lifts[x.ex]=lifts[x.ex]||{c:[],p:[]})[x.d>=NOW-6?'c':'p'].push(e1(x)));
  K.lifts=Object.keys(lifts).map(id=>({id:+id,c:avg(lifts[id].c),p:avg(lifts[id].p),n:lifts[id].c.length+lifts[id].p.length})).sort((a,b)=>b.n-a.n).slice(0,3);
  K.pain={c:avg(cur.map(x=>x.pain)),p:avg(pri.map(x=>x.pain))};K.ease={c:avg(cur.map(x=>x.ease)),p:avg(pri.map(x=>x.ease))};
  const dm=cur.filter(x=>x.dietMet!=null&&x.dietMet!==undefined);K.diet=dm.length?Math.round(dm.filter(x=>x.dietMet).length/dm.length*100):null;
  const sp=cur.filter(x=>x.dietMet!=null);K.supp=sp.length?Math.round(sp.filter(x=>x.supps&&x.supps.length).length/sp.length*100):null;
  K.kcal=avg(cur.filter(x=>x.kcal).map(x=>x.kcal));K.prot=avg(cur.filter(x=>x.protein).map(x=>x.protein));
  K.strain={Low:0,Moderate:0,High:0};cur.forEach(x=>{if(K.strain[x.strain]!=null)K.strain[x.strain]++});
  const F=[];
  if(cur.length&&pri.length&&K.pain.c-K.pain.p>=(c.track=='Therapy'?1.5:2))F.push({t:'Pain rising',m:'Average pain up '+(K.pain.c-K.pain.p).toFixed(1)+' points week on week ('+K.pain.p.toFixed(1)+' → '+K.pain.c.toFixed(1)+').'});
  const hi=cur.filter(x=>x.pain>=6).sort((a,b)=>b.pain-a.pain)[0];
  if(hi){const e=ex(hi.ex),r=e.reg?ex(e.reg):null;F.push({t:'Pain 6/10 or more',m:'Pain '+hi.pain+'/10 on '+e.name+' ('+fmt(hi.d)+').',reg:r})}
  else if(F.length&&F[0].t=='Pain rising'){const lx=cur[cur.length-1],e=ex(lx.ex);F[0].reg=e.reg?ex(e.reg):null}
  if(cur.length&&pri.length&&K.ease.c-K.ease.p>=2){const l1=avg(cur.map(x=>x.load)),l0=avg(pri.map(x=>x.load)),flat=(l1==0&&l0==0)||Math.abs(l1-l0)<=Math.max(l0,l1)*.05+0.01;if(flat)F.push({t:'Fatigue',m:'Effort rose '+(K.ease.c-K.ease.p).toFixed(1)+' points ('+K.ease.p.toFixed(1)+' → '+K.ease.c.toFixed(1)+') while the load stayed flat.'})}
  const pf=cur.filter(x=>x.form<=2||(x.faults&&String(x.faults).length));if(pf.length>=2)F.push({t:'Posture faults',m:pf.length+' sessions with form faults in 7 days'+(pf.some(x=>x.faults)?' ('+[...new Set(pf.map(x=>x.faults).filter(Boolean).join(', ').split(', '))].join(', ')+')':'')+'.'});
  const rd=cur.filter(x=>x.out=='regressed').sort((a,b)=>b.pain-a.pain)[0];
  if(rd){const e=ex(rd.ex),r=e&&e.reg?ex(e.reg):null;F.push({t:'Rated ▼ (lesser / form)',m:(e?e.name:'Exercise')+' rated ▼ on '+fmt(rd.d)+(rd.why?' ('+(WHY[rd.why]||rd.why)+')':'')+'.',reg:r})}
  if(!rd){const ra=winA(c,NOW-6,NOW).filter(x=>x.out=='regressed')[0];if(ra)F.push({t:'Rated ▼ (lesser / form)',m:ra.name+' rated ▼ on '+fmt(ra.d)+(ra.why?' ('+(WHY[ra.why]||ra.why)+')':'')+'.'})}
  const PS=planStats(c,7);K.plan=PS;
  if(PS.flagged.length){const f=PS.flagged[0];F.push({t:'Workout flagged',m:PS.flagged.length+' planned workout'+(PS.flagged.length>1?'s':'')+' not completed. Latest: '+f.name+' ('+(f.reason||'no reason')+(f.pain!=null?', pain '+f.pain+'/10':'')+', '+dlabel(f.date)+').'})}
  if(PS.missed.length)F.push({t:'Missed workouts',m:PS.missed.length+' planned workout'+(PS.missed.length>1?'s':'')+' not ticked off in the last 7 days.'});
  K.flags=F;K.other=alerts(c).filter(a=>!['Pain rising','Form decline'].includes(a[0]));
  return K;
}

  const mains=[],cards=[],pw=[],pp=[],pc=[];items.forEach((it,i)=>{const sc=it.sec;if(sc=='warm')pw.push([it,i]);else if(sc=='pir')pp.push([it,i]);else if(sc=='post')pc.push([it,i]);else (it.type=='cardio'?cards:mains).push([it,i])});

  const ms=itemMuscles((mains.length?mains:cards).map(x=>x[0]));

  planned(pw,1,'warm','Planned warmup','warmup').forEach(x=>out.push(x));
  const G=DYN.none;[0,1].forEach(k=>{const d=G[(day+k)%G.length];if(!out.some(x=>x.name==d[0]))out.push({key:'g'+k,ph:1,kind:'warm',grp:'Overall warmup',name:d[0],cue:d[1],m:[],act:'warmup'})});

  const e=r.ex?ex(r.ex):null,got=[];if(e)got.push(e.name);['sets','reps','load','ease','form','pain'].forEach(k=>{if(r[k]!=null)got.push((k=='ease'?'effort':k)+' '+r[k])});if(r.faults)got.push('faults: '+r.faults.join(', '));
  if(!doSave){m.textContent=got.length?'Understood: '+got.join(' · ')+'. Say save to record it.':'Did not catch an exercise or number. Try again or type.';return}
  if(!e){m.textContent='Not saved: say the exercise name too.';return}
  const pi=dayItems(c,c.day).find(it=>it.ex==e.id)||{},bad=(r.pain!=null&&r.pain>=6)||(r.faults&&r.faults.length);
  saveLog(c,{ex:e.id,sets:r.sets!=null?r.sets:(pi.sets||3),reps:r.reps!=null?r.reps:(pi.reps||10),load:r.load!=null?r.load:(pi.load||0),ease:r.ease!=null?r.ease:5,form:r.form!=null?r.form:3,pain:r.pain||0,faults:r.faults,notes:raw,outcome:bad?'regressed':'done',reason:r.pain>=6?'pain_spike':(r.faults&&r.faults.length?'form_mistake':''),act:pi.type||'strength',day:c.day,source:'voice'});
  S.toast='✓ Saved '+e.name+' for '+c.name.split(' ')[0];render();
}

function advanceDay(c,force){
  const D=Math.max(planDays(c),1),from=c.day||1,to=from>=D?1:from+1;
  c.day=to;c.run=null;TM.w=undefined;Object.keys(TM).forEach(k=>{if(k[0]=='s')delete TM[k]});
  if(c.demo||AUTH.demo)cacheSave();else pushQ({kind:'day',lid:c.id,from,to}).then(ok=>{setState(ok?'synced':'offline',CLOUD.err)});
  S.toast=(force?'Skipped to ':'Day '+from+' complete. Now on ')+'Day '+to;render();scrollTo(0,0);
}

function streakOf(c){
  const days=new Set([...(c.s||[]).map(x=>x.d),...(c.acts||[]).map(x=>x.d)]);let n=0,d=days.has(NOW)?NOW:NOW-1;while(days.has(d)){n++;d--}return n;
}
function dietAdh(c,a,b){
  mkEmpty(c);const arr=[];
  for(let d=a;d<=b;d++){
    const ss=(c.s||[]).filter(x=>x.d==d),prot=ss.reduce((p,x)=>p+(x.protein||0),0)+(d==NOW?foodTot(c).p:0);
    if(prot>0){arr.push(Math.min(1,prot/protTarget(c)));continue}
    const m=ss.filter(x=>x.dietMet!=null&&x.dietMet!==undefined);if(m.length)arr.push(m.filter(x=>x.dietMet).length/m.length);
  }
  return arr.length?Math.round(arr.reduce((p,x)=>p+x,0)/arr.length*100):null;
}
function recoveryScore(c){
  const cur=win(c,NOW-6,NOW),ac=winA(c,NOW-6,NOW);if(!cur.length&&!ac.length)return null;
  let sc=100;const ap=avg(cur.map(x=>x.pain));if(ap!=null)sc-=ap*10;
  sc-=Math.min(15,new Set(cur.filter(x=>x.sleep=='poor').map(x=>x.d)).size*5);sc-=Math.min(15,cur.filter(x=>x.out=='regressed').length*5);
  const rl=avg(ac.filter(a=>a.relief).map(a=>a.relief));if(rl!=null)sc+=(rl-5);
  return clamp(Math.round(sc),0,100);
}

function trackModel(c,K){

  const faults=a=>a.filter(x=>x.form<=2||(x.faults&&String(x.faults).length)).length;
  const pfree=a=>{const v=a.filter(x=>x.load>0&&x.pain<=2).map(x=>x.load);return v.length?Math.max(...v):null};
  const ton=a=>Math.round(sum(a,x=>x.sets*x.reps*(x.load||0))+sum((a===K.cur?A1:A0).filter(x=>x.act=='strength'||x.act=='physio'),x=>x.sets*x.reps*(x.load||0)));

    let verdict,cls;if(n>=3&&good/n>=.8&&!reds&&(ap==null||ap<=3)){verdict='Ready for L'+Math.min(5,L+1);cls='good'}else if(reds>=2||(ap!=null&&ap>=5)){verdict='Consider L'+Math.max(1,L-1);cls='bad'}else{verdict='Stay at L'+L;cls=''}
    ex2.ready={L,verdict,cls,n,good,reds};
    rows.push({k:'Pain-free load tolerance',c:pfree(K.cur),p:pfree(K.pri),f:v=>v+' kg',dir:'up'},{k:'Posture / form faults',c:faults(K.cur),p:faults(K.pri),f:v=>v+'',dir:'down'},{k:'Cardio conditioning',c:cm(A1),p:cm(A0),f:v=>v+' min',dir:'up'},{k:'Average pain',c:K.pain.c,p:K.pain.p,f:v=>v.toFixed(1)+'/10',dir:'down'});
  }else{

  }

  const items=[...c.s.filter(x=>x.d>=NOW-6).map(x=>({e:ex(x.ex),sets:x.sets,o:x.out,d:x.d})),...winA(c,NOW-6,NOW).filter(x=>x.act=='strength'||x.act=='physio').map(x=>({e:EXR.find(z=>z.name==x.name),sets:x.sets||1,o:x.out,d:x.d}))].filter(x=>x.e&&x.e.muscles);
  const work={},imp={},byDay={};
  items.forEach(x=>x.e.muscles.slice(0,2).forEach((m,i)=>{if(!MUSC[m])return;const w=(i?.5:1)*(x.sets||1);work[m]=(work[m]||0)+w;if(x.o=='improved'&&!i)imp[m]=(imp[m]||0)+1;const d=byDay[x.d]=byDay[x.d]||{};d[m]=Math.max(d[m]||0,w)}));
  const H=heatNew(c),need={};Object.keys(H).forEach(m=>{if(H[m].st=='weak'||H[m].st=='tight')need[m]=H[m].st});
  return{work,imp,byDay,need,mx:Math.max(1,...Object.values(work))};
}
function repApply(c,mode,day){
  const D=repData(c),map={},info={};
  if(mode=='imp')Object.keys(D.imp).forEach(m=>{map[m]={c:[.06,.88,.55],g:1.9};info[m]='▲ improved '+D.imp[m]+'× this week'});
  else if(mode=='work')Object.keys(D.work).forEach(m=>{const k=D.work[m]/D.mx;map[m]={c:[.02,.71,.83],g:.7+1.3*k};info[m]=Math.round(D.work[m])+' weighted sets this week'});
  else if(mode=='need')Object.keys(D.need).forEach(m=>{const w=D.need[m]=='weak';map[m]={c:w?[.96,.25,.37]:[1,.62,.11],g:1.7,p:w?1:0};info[m]=w?'Needs physio or activation':'Needs stretching'});
  else if(mode=='replay'){const d=D.byDay[day]||{};Object.keys(d).forEach(m=>{map[m]={c:[.02,.71,.83],g:1.9};info[m]='Worked on '+fmt(day)})}
  BODY.rep={mode,map,info,n:Object.keys(map).length};BODY.dirty=true;return D;
}
function repLabels(c){const D=repData(c);return{imp:Object.keys(D.imp).length,work:Object.keys(D.work).length,need:Object.keys(D.need).length}}
function repStageHTML(c){
  BODY.cid=c.id;const L=repLabels(c),M=S.rp&&S.rp.mode||'work';
  const chip=(k,t,n)=>'<button class="gb'+(M==k?' on':'')+'" data-rp="'+k+'">'+t+(n!=null?' <small>'+n+'</small>':'')+'</button>';
  return '<div class="noprint stage sm" id="stage"><canvas id="bc" aria-label="Rotatable 3D muscle impact view for this week" role="img"></canvas>'+
   '<div class="stg-top glass"><div class="wrow" style="margin:0">'+chip('imp','▲ Improved',L.imp)+chip('work','Most worked',L.work)+chip('need','Needs care',L.need)+chip('replay','▶ Replay')+'</div></div>'+ROTB+'<div id="callout" class="callout"></div>'+
   '<div class="stg-bot glass rpinfo" id="rpinfo"></div></div>';
}
function repInit(){

function repInfoText(c,mode){
  const D=repData(c),nm=o=>Object.keys(o).sort((a,b)=>(o[b]||0)-(o[a]||0)).slice(0,4).map(mnm).join(', ');
  if(mode=='imp')return Object.keys(D.imp).length?'<b style="color:#34d399">▲ Improved:</b> '+esc(nm(D.imp)):'No ▲ ratings yet this week. Rate ▲ when a drill feels clearly better.';
  if(mode=='work')return Object.keys(D.work).length?'<b style="color:#22d3ee">Most worked:</b> '+esc(nm(D.work)):'No strength sessions logged this week.';
  if(mode=='need')return Object.keys(D.need).length?'<b style="color:#fb7185">Needs physio or stretching:</b> '+esc(Object.keys(D.need).slice(0,5).map(mnm).join(', ')):'Nothing flagged. Muscles look balanced.';

function repSet(mode,day,label){

  step();S.rpT=setInterval(step,1100);

// ================= v25: WORKOUT = same 5 collapsible bubbles, 4-button rows over the 3D stage =================
const WBSEC=[['pir','1','Stretches / PIR'],['warm','2','Warmup'],['main','3','Workouts'],['cardio','4','Cardio'],['post','5','Post-Stretch']];
const stSec=s=>({pir:'pir',warm:'warm',main:'main',cardio:'cardio',cool:'post'})[s.kind]||'main';
const WBTN=[['done','✓','ok','Completed as planned'],['skipped','✕','xx','Skipped or unable'],['improved','▲','up','Done well, improvement'],['regressed','▼','dn','Lesser, form mistake or pain']];
function stripWk(c){
  const st=buildSteps(c),staff=asStaff(),n=c.day||1,D=planDays(c),done=st.filter(s=>stStat(c,s)).length,pc=st.length?Math.round(done/st.length*100):0;
  return '<div class="wstrip">'+(staff?'<button class="dpill" data-h3="plan" aria-label="Edit plan">Day '+n+(D?'/'+D:'')+' ✎</button>':'<span class="dpill">Day '+n+(D?'/'+D:'')+'</span>')+'<div class="pbar"><i style="width:'+pc+'%"></i></div><b class="pcnt">'+done+'/'+st.length+'</b></div>';
}
function wrow(c,s,i,R){
  const res=stStat(c,s),pend=S.rwi===i&&!res,m=s.m[0],e=s.it?ex(s.it.ex):s.e,lv=e&&e.level?e.level:(m&&MUSC[m]?mlOf(c,m):null),cur=R.cur==i;
  const tag=m&&MUSC[m]?mnm(m).split(' (')[0]:(s.legs?'Legs':'Full body');
  const btns=WBTN.map(b=>{const lit=(res&&res.st==b[0])||(pend&&b[0]=='regressed');return '<button class="sq4 '+b[2]+(lit?' lit':'')+(res&&!lit?' off':'')+'" data-wb="do" data-i="'+i+'" data-s="'+b[0]+'" aria-label="'+b[3]+'"'+(res?' disabled':'')+'>'+b[1]+'</button>'}).join('');

  }
  if(pend)extra+='<div class="chips" style="margin-top:6px"><span class="sm mute" style="align-self:center">Reason (optional)</span>'+[['form_mistake','Form Mistake'],['early_fatigue','Fatigue'],['pain_spike','Vali / Pain']].map(x=>'<span class="chip" data-wb="why" data-w="'+x[0]+'">'+x[1]+'</span>').join('')+'</div>';

function wbCommit(){if(S.rwi==null)return;const k=S.rwi;clearTimeout(S.rwT);S.rwi=null;S.rwhy=null;wbLog(k,'regressed','')}
function wbLog(k,stt,why){
  const c=cl(activeCid());if(!c)return;const st=buildSteps(c),R=runOf(c),s=st[k];if(!s||stStat(c,s))return;
  logStep(c,s,stt,why);
  if(stt=='improved')wflash('🌟 Milestone · Ready to progress','up');else if(stt=='regressed')wflash('Logged ▼ · flagged for your clinician','dn');
  if(s.ph==2&&(stt=='done'||stt=='improved'))restStart();
  const nx=firstOpen(c,st,k+1);R.cur=nx;if(nx<st.length)S.wkOpen=stSec(st[nx]);cacheSave();wRefresh();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-wb]');if(!t)return;const a=t.dataset.wb,c=cl(activeCid());if(!c)return;
  const st=buildSteps(c),R=runOf(c),i=+t.dataset.i;
  if(a=='acc'){wbCommit();S.wkOpen=S.wkOpen==t.dataset.v?null:t.dataset.v;wRefresh()}
  else if(a=='row'){wbCommit();R.cur=i;wRefresh()}
  else if(a=='do'){const s=st[i];if(!s||stStat(c,s))return;if(S.rwi!=null&&S.rwi!=i)wbCommit();
    if(t.dataset.s=='regressed'){S.rwi=i;S.rwhy=s.key;R.cur=i;clearTimeout(S.rwT);S.rwT=setTimeout(wbCommit,5000);wRefresh();return}
    wbLog(i,t.dataset.s,'')}
  else if(a=='why'){const k=S.rwi;if(k==null)return;clearTimeout(S.rwT);S.rwi=null;S.rwhy=null;wbLog(k,'regressed',t.dataset.w||'')}
  else if(a=='rel'){R.rel=R.rel||{};R.rel[st[i].key]=+t.dataset.v;wRefresh()}
  else if(a=='skipw'){wbCommit();R.s=R.s||{};st.filter(x=>stSec(x)=='warm'&&!stStat(c,x)).forEach(x=>{R.s[x.key]={st:'skipped',why:''}});saveAct(c,{outcome:'skipped',act:'warmup',name:'Warmup (skipped)',dur:0,day:c.day});const nx=firstOpen(c,st,0);R.cur=nx;if(nx<st.length)S.wkOpen=stSec(st[nx]);cacheSave();wflash('Warmup skipped','');wRefresh()}
  else if(a=='unp'){S.up={type:'strength'};openUnplanned()}
  else if(a=='adv'){if(!st.every(x=>stStat(c,x)))return;advanceDay(c,false)}
});

function progSuggest(c){
  const up={},dn={},lu=(c.mt&&c.mt._up)||{};
  const items=[...c.s.filter(x=>x.d>=NOW-29).map(x=>({e:ex(x.ex),o:x.out,d:x.d})),...(c.acts||[]).filter(x=>x.d>=NOW-29&&(x.act=='strength'||x.act=='physio')).map(x=>({e:EXR.find(z=>z.name==x.name),o:x.out,d:x.d}))];
  items.forEach(x=>{const m=x.e&&x.e.muscles&&x.e.muscles[0];if(!m||!MUSC[m]||x.d<=(lu[m]==null?-1e9:lu[m]))return;if(x.o=='improved')up[m]=(up[m]||0)+1;else if(x.o=='regressed')dn[m]=(dn[m]||0)+1});
  return Object.keys(up).filter(m=>up[m]>=3&&!dn[m]&&mlOf(c,m)<5).map(m=>({m,ups:up[m],lv:mlOf(c,m)})).sort((a,b)=>b.ups-a.ups);
}
const progFor=(c,m)=>progSuggest(c).find(p=>p.m==m);
const progLine=p=>'🌟 '+mnm(p.m)+' Ready for L'+(p.lv+1)+' (Consistent ▲ progress)';
const progBtn=p=>'<button class="upg" data-pg="up" data-m="'+p.m+'">Upgrade Level</button>';
function progBanner(c,m){const p=m&&progFor(c,m);if(!p)return '';return '<div class="prg"><span>'+esc(progLine(p))+'</span>'+(asStaff()?progBtn(p):'')+'</div>'}
function progCard(c){
  const P=progSuggest(c);if(!P.length)return '';
  return '<div class="card glowc"><h3>🌟 Monthly progression</h3>'+P.map(p=>'<div class="prg"><span>'+esc(progLine(p))+' <span class="sm mute">· '+p.ups+'× ▲ in 30 days</span></span>'+(asStaff()?progBtn(p):'')+'</div>').join('')+(asStaff()?'':'<div class="sm mute" style="margin-top:6px">Your coach will upgrade your level.</div>')+'</div>';
}

  o.innerHTML='<div id="thole"></div><div id="tcard" class="glass"><i id="tarrow"></i><div class="tc-n" id="tcn"></div><b id="tct"></b><p id="tcx"></p><label class="tc-nv"><input type="checkbox" id="tcnever"> Don’t show again</label><div class="tc-b"><button class="gb" data-tour="voice" id="tcv"></button><button class="gb" data-tour="back" id="tcb">←</button><button class="gb" data-tour="skip">Skip</button><button class="b cta" data-tour="next" id="tcnx">Next →</button></div></div>';
  document.body.appendChild(o);tourGo(0);
}
function tourGo(i){
  const T=S.tour;if(!T)return;T.i=i;const st=T.steps[i];speechSynthesis&&speechSynthesis.cancel&&speechSynthesis.cancel();
  if(st.go){try{st.go()}catch(e){}}
  $('#tcn').textContent='Step '+(i+1)+' of '+T.steps.length;$('#tct').textContent=st.t;$('#tcx').textContent=st.x;
  $('#tcv').textContent=S.tourVoice?'🔊 Voice On':'🔇 Voice Off';$('#tcb').style.visibility=i?'visible':'hidden';$('#tcnx').textContent=i==T.steps.length-1?'Finish ✓':'Next →';
  clearTimeout(T.pt);T.pt=setTimeout(()=>{tourPlace();tourSpeak(st.t+'. '+st.x)},st.go?700:250);
}
function tourPlace(){
  const T=S.tour;if(!T)return;const st=T.steps[T.i],el=document.querySelector(st.sel),h=$('#thole'),c=$('#tcard'),ar=$('#tarrow');
  const r=el&&el.getBoundingClientRect(),vw=innerWidth,vh=innerHeight;
  if(!r||r.width<4||r.height<4){h.style.display='none';ar.style.display='none';c.style.left='50%';c.style.top='50%';c.style.transform='translate(-50%,-50%)';return}
  const p=6,x=Math.max(2,r.left-p),y=Math.max(2,r.top-p),w=Math.min(vw-4,r.width+p*2),hh=Math.min(vh-4,r.height+p*2);
  h.style.display='block';h.style.cssText+=';left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+hh+'px';
  c.style.transform='none';const ch=c.offsetHeight,below=(y+hh/2)<vh*.5;
  let top=below?y+hh+16:y-ch-16;top=Math.max(8,Math.min(vh-ch-8,top));
  if(!below&&y-ch-16<8)top=Math.max(8,y+hh+16>vh-ch?8:y+hh+16);
  c.style.top=top+'px';const cw=Math.min(vw-16,360);c.style.width=cw+'px';c.style.left=Math.max(8,Math.min(vw-cw-8,(x+w/2)-cw/2))+'px';
  const cx=(x+w/2)-parseFloat(c.style.left);ar.style.display='block';ar.style.left=Math.max(18,Math.min(cw-18,cx))+'px';
  const up=top>y+hh/2;ar.className=up?'down':'up';
}
function tourEnd(){
  const T=S.tour;if(!T)return;clearTimeout(T.pt);try{speechSynthesis.cancel()}catch(e){}
  if($('#tcnever')&&$('#tcnever').checked)lsSet('sparrc_tour_off',true);
  const o=$('#tour');if(o)o.remove();S.tour=null;
  if(hudStaff()){S.tab='hub';S.floor=false}else{S.tab='workout'}render();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tour]');if(!t)return;const a=t.dataset.tour,T=S.tour;
  if(a=='start'){menuClose();tourStart()}
  else if(a=='never'){lsSet('sparrc_tour_off',!tourOff());render()}
  else if(a=='voice'&&T){S.tourVoice=!S.tourVoice;lsSet('sparrc_tour_voice',S.tourVoice);$('#tcv').textContent=S.tourVoice?'🔊 Voice On':'🔇 Voice Off';if(S.tourVoice){const st=T.steps[T.i];tourSpeak(st.t+'. '+st.x)}else try{speechSynthesis.cancel()}catch(x){}}
  else if(a=='next'&&T){if(T.i>=T.steps.length-1)tourEnd();else tourGo(T.i+1)}
  else if(a=='back'&&T&&T.i>0)tourGo(T.i-1);
  else if(a=='skip')tourEnd();
});
document.addEventListener('click',e=>{const t=e.target.closest('[data-hd=tour]');if(t){e.stopImmediatePropagation();menuClose();tourStart()}},true);
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&S.tour)tourEnd()});
window.addEventListener('resize',()=>{if(S.tour)tourPlace()});

const _wkSync0=wkSync;wkSync=function(){if(S.calOn){BODY.wk=false;return}_wkSync0();if($('#fcs'))fcAlign();if(S.floor&&S.tab=='workout'&&hudStaff()&&!S.fAuto){S.fAuto=true;floorAuto()}};

if(typeof document!=='undefined'&&document.getElementById('app')){libLoad();sbInit();}
</script></body></html>
