function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296*2-1}}
function build(spec){
  const r=rng(spec.seed),s=[];let k=0;
  for(let w=0;w<8;w++)for(const o of [0,2,4]){
    if(spec.skip&&spec.skip(w,o))continue;
    const kk=w*3+[0,2,4].indexOf(o),t=kk/23,n=r();
    const rm=kk%4==3;
    s.push({d:w*7+o,ex:spec.primary,sets:3,reps:spec.reps,

      ease:clamp(Math.round(spec.ease(kk,t,n)),1,10),
      form:clamp(Math.round(spec.form(kk,t,n)*2)/2,1,4),
      pain:clamp(Math.round(spec.pain(kk,t,n)),0,10),
      rom:rm?Math.round(spec.rom(kk,t,n)):null});
  }
  return s;
}

function parseVoice(raw,clients,exs){
  let t=' '+raw.toLowerCase().replace(/[,.;]/g,' ').split(/\s+/).map(w=>w in NUMW?NUMW[w]:w).join(' ')+' ';
  t=t.replace(/(\d+)\s*point\s*(\d)/g,'$1.$2');
  const r={},num='(\\d+(?:\\.\\d+)?)';
  const c=clients.find(c=>c.name.toLowerCase().split(' ').some(w=>w.length>2&&t.includes(' '+w+' ')));
  if(c)r.cid=c.id;
  let best=null,bs=0;
  for(const e of exs){const ws=e.name.toLowerCase().replace(/[^a-z ]/g,' ').split(' ').filter(w=>w.length>2);
    const hit=ws.filter(w=>t.includes(w.replace(/s$/,''))).length,sc=ws.length?hit/ws.length+ws.length*.01:0;
    if(hit&&sc>bs){bs=sc;best=e}}
  if(best&&bs>=.5)r.ex=best.id;
  let m;
  if(m=t.match(new RegExp(num+' sets? (?:of|x|×) '+num))){r.sets=+m[1];r.reps=+m[2]}
  else if(m=t.match(new RegExp(num+' ?(?:x|×|by) ?'+num+'(?! ?(?:kg|kilo|degree))'))){r.sets=+m[1];r.reps=+m[2]}
  else{if(m=t.match(new RegExp(num+' reps?')))r.reps=+m[1];if(m=t.match(new RegExp(num+' sets?')))r.sets=+m[1]}
  if(m=t.match(new RegExp(num+' ?(?:kg|kgs|kilos?|kilograms?|கிலோ)')))r.load=+m[1];
  else if(m=t.match(new RegExp(num+' ?(?:lbs?|pounds?)')))r.load=Math.round(m[1]*.4536*2)/2;
  if(m=t.match(new RegExp('(?:ease|effort|rpe) (?:was |is |of |at )?'+num)))r.ease=clamp(Math.round(+m[1]),1,10);
  else if(/\b(felt|was|very) (really )?(easy|light)\b/.test(t))r.ease=3;
  else if(/\b(felt|was|very) (moderate|okay|ok)\b/.test(t))r.ease=5;
  else if(/\b(felt|was|very) (really )?(hard|heavy|difficult|tough)\b|kashtam|kastam|கஷ்டம்/.test(t))r.ease=8;
  else if(/easya|ஈசி/.test(t))r.ease=3;
  if(/no pain|pain free|pain-free|vali illa|வலி இல்ல/.test(t))r.pain=0;
  else if(m=t.match(new RegExp('(?:pain|vali|வலி) (?:was |is |of |at |level )?'+num)))r.pain=clamp(Math.round(+m[1]),0,10);
  if(m=t.match(/form (?:was |is |score )?([1-4])\b/))r.form=+m[1];
  else if(/\b(clean|perfect|excellent)\b|semma|சூப்பர்/.test(t))r.form=4;
  else if(/\b(good|minor)\b|nalla|நல்ல/.test(t))r.form=3;
  else if(/\b(poor|major|sloppy|bad)\b|sariya illa|சரியில்ல/.test(t))r.form=2;
  else if(/unsafe|dangerous/.test(t))r.form=1;
  if(m=t.match(new RegExp(num+' ?(?:degrees?|டிகிரி|°)')))r.rom=Math.round(+m[1]);
  return r;
}
function buildSheet(c){
  const s=[...c.s].sort((a,b)=>a.d-b.d),L=s[s.length-1];
  if(!L)return{S:'',O:'',A:'',P:'',date:null};
  const P=s.slice(0,-1).reverse().find(x=>x.ex==L.ex),e=ex(L.ex);
  const dl=(a,b,u)=>{const d=Math.round((a-b)*10)/10;return(d>0?'+':'')+d+u};
  let O=e.name+': '+L.sets+'×'+L.reps+(L.load?' @ '+L.load+' kg':'')+' (est. 1RM '+e1(L).toFixed(1)+' kg'+(P?', '+dl(e1(L),e1(P),' kg')+' vs previous session':'')+'). Form '+L.form+'/4, effort '+L.ease+'/10, pain '+L.pain+'/10.';
  if(L.rom!=null){const q=s.filter(x=>x.rom!=null&&x!==L).pop();O+=' ROM '+L.rom+'°'+(q?' ('+dl(L.rom,q.rom,'°')+' vs last measure)':'')+'.'}
  const m=metrics(c,wsel(c,NOW-13,NOW));
  O+=' Last 2 weeks: avg pain '+(m.pain??0).toFixed(1)+'/10, avg form '+(m.form??0).toFixed(1)+'/4, adherence '+Math.round(m.adh*100)+'%.';
  const Sj=L.notes?'Client reports: '+L.notes:'Pain recorded at '+L.pain+'/10 with '+e.name.toLowerCase()+', effort '+L.ease+'/10. (Add anything the client told you.)';
  const st=status(c),al=alerts(c),tol=L.pain<=2&&L.form>=3&&L.ease<=7;
  let A=(tol?'Session tolerated well with good control. ':L.pain>=5?'High pain response to this session. ':'Session tolerated with some difficulty. ');
  if(P)A+=e1(L)>e1(P)*1.02?'Strength up on the last session. ':e1(L)<e1(P)*.95?'Strength down on the last session. ':'Strength steady. ';
  if(st.i!=null)A+='Progress Index '+st.i+' ('+st.t+'). ';
  A+=al.map(a=>a[0]+': '+a[1]+'. ').join('');
  let Pl;
  if(al.some(a=>a[0]=='Pain rising')||L.pain>=6)Pl='Reduce load by 10–20%'+(e.reg?' or regress to '+ex(e.reg).name:'')+'. Re-check pain at the next visit and consider re-assessment.';
  else if(al.length)Pl='Review flagged items ('+al.map(a=>a[0]).join(', ')+') with the client and adjust the programme.';
  else if(suggestion(c)&&L.ex==c.primary)Pl=suggestion(c);
  else if(tol)Pl='Continue. Increase load 2.5–5% next session if form and pain stay the same.';
  else Pl='Hold the current load, cue form, and review again next session.';
  const wl=wellLines(c);
  return{S:Sj+wl.S,O:O+wl.O,A:(A.trim()+wl.A).trim(),P:Pl+wl.P,date:L.d};
}

function chart(title,pts,o={}){
  if(pts.length<2)return '<div class="card"><h3>'+title+'</h3><div class="mute sm">Not enough data yet</div></div>';
  const W=300,H=110,L=26,B=16,T=8,R=8;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const x0=Math.min(...xs),x1=Math.max(...xs);let y0=Math.min(...ys),y1=Math.max(...ys);
  if(y1-y0<1){y0-=1;y1+=1}const pad=(y1-y0)*.15;y0-=pad;y1+=pad;
  const X=x=>L+(x-x0)/((x1-x0)||1)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  const d=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const last=pts[pts.length-1],first=pts[0];
  const better=o.low?last.y<first.y:last.y>first.y,flat=Math.abs(last.y-first.y)<(y1-y0)*.05;
  const col=flat?'var(--mute)':better?'var(--good)':'var(--bad)';
  return '<div class="card"><div class="row"><h3>'+title+'</h3><span class="sm" style="color:'+col+'">'+last.y.toFixed(o.dp??0)+(o.unit||'')+'</span></div>'+
  '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+title+' trend">'+
  '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" stroke="var(--line)"/>'+
  '<text x="2" y="'+(T+6)+'">'+(y1-pad).toFixed(o.dp??0)+'</text><text x="2" y="'+(H-B)+'">'+(y0+pad).toFixed(o.dp??0)+'</text>'+
  '<text x="'+L+'" y="'+(H-3)+'">'+(o.xl?o.xl(first.x):fmt(first.x))+'</text><text x="'+(W-R)+'" y="'+(H-3)+'" text-anchor="end">'+(o.xl?o.xl(last.x):fmt(last.x))+'</text>'+
  '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round"/>'+
  pts.map(p=>'<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="2.4" fill="'+col+'"/>').join('')+'</svg></div>';
}

function micFallback(msg){const m=$('#vmsg');if(m)m.innerHTML=msg+'<br><b>Use this instead:</b> tap the box below, press the 🎤 key on your phone keyboard, speak, then tap Apply text.';const v=$('#vtext');if(v){try{v.focus()}catch(e){}}}
function micToggle(){
  const m=$('#vmsg'),btn=$('#mic');
  if(REC){try{REC.stop()}catch(e){};return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){micFallback('Live voice capture is not available in this viewer.');return}
  try{
    const r=new SR();r.lang=($('#vlang')||{}).value||'en-IN';r.continuous=true;r.interimResults=true;HELD='';
    r.onstart=()=>{btn.textContent='■ Listening… tap to stop';btn.classList.add('rec');m.textContent='Listening. Speak now, tap again when done.'};
    r.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript+' ';HELD=s.trim();$('#vtext').value=HELD};
    r.onerror=e=>{REC=null;btn.textContent='🎤 Tap to speak';btn.classList.remove('rec');
      if(e.error=='not-allowed'||e.error=='service-not-allowed')micFallback('The microphone is blocked here (permission denied by this viewer).');
      else if(e.error=='no-speech')m.textContent='Did not hear anything. Move closer to the mic and tap again.';
      else if(e.error=='network')micFallback('Speech recognition needs an internet connection.');
      else micFallback('Voice error: '+e.error+'.')};
    r.onend=()=>{REC=null;const b=$('#mic');if(b){b.textContent='🎤 Tap to speak';b.classList.remove('rec')}if(HELD)applyVoice()};
    REC=r;r.start();m.textContent='Starting microphone… allow access if asked.';
  }catch(err){REC=null;micFallback('Could not start the microphone ('+(err&&err.name||'error')+').')}
}

async function noiseCheck(){
  const m=$('#vnoise');
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false}});
    const ac=new (window.AudioContext||window.webkitAudioContext)(),an=ac.createAnalyser();an.fftSize=2048;ac.createMediaStreamSource(st).connect(an);
    const buf=new Float32Array(an.fftSize);let sum=0,n=0;m.textContent='Measuring for 3 seconds…';
    await new Promise(res=>{const t0=Date.now(),iv=setInterval(()=>{an.getFloatTimeDomainData(buf);let q=0;for(const v of buf)q+=v*v;sum+=20*Math.log10(Math.sqrt(q/buf.length)||1e-6);n++;if(Date.now()-t0>3000){clearInterval(iv);res()}},100)});
    st.getTracks().forEach(t=>t.stop());ac.close();
    const db=sum/n;
    m.textContent=db<-50?'Quiet ('+db.toFixed(0)+' dB). Voice entry should work well.':db<-35?'Busy ('+db.toFixed(0)+' dB). Use a headset mic and speak close to it.':'Very loud ('+db.toFixed(0)+' dB). Use a headset or clip-on mic, or type this entry.';
  }catch(err){m.textContent='Cannot reach the microphone here (blocked in this preview). In the live app this will report the floor noise level.'}
}

const win=(c,a,b)=>c.s.filter(x=>x.d>=a&&x.d<=b);
function kpis(c){
  const cur=win(c,NOW-6,NOW),pri=win(c,NOW-13,NOW-7);
  const vol=a=>a.reduce((p,x)=>p+x.sets*x.reps*(x.load||0),0),rp=a=>a.reduce((p,x)=>p+x.sets*x.reps,0);
  const useReps=vol(cur)+vol(pri)==0,V1=useReps?rp(cur):vol(cur),V0=useReps?rp(pri):vol(pri);
  const K={cur,pri,vol:{v1:V1,v0:V0,unit:useReps?'total reps (bodyweight work)':'kg (sets × reps × load)',pct:V0?(V1/V0-1)*100:null}};
  const lifts={};[...cur,...pri].filter(x=>x.load>0).forEach(x=>(lifts[x.ex]=lifts[x.ex]||{c:[],p:[]})[x.d>=NOW-6?'c':'p'].push(e1(x)));
  K.lifts=Object.keys(lifts).map(id=>({id:+id,c:avg(lifts[id].c),p:avg(lifts[id].p),n:lifts[id].c.length+lifts[id].p.length})).sort((a,b)=>b.n-a.n).slice(0,3);
  K.pain={c:avg(cur.map(x=>x.pain)),p:avg(pri.map(x=>x.pain))};K.ease={c:avg(cur.map(x=>x.ease)),p:avg(pri.map(x=>x.ease))};
  const dm=cur.filter(x=>x.dietMet!=null&&x.dietMet!==undefined);K.diet=dm.length?Math.round(dm.filter(x=>x.dietMet).length/dm.length*100):null;
  const sp=cur.filter(x=>x.dietMet!=null);K.supp=sp.length?Math.round(sp.filter(x=>x.supps&&x.supps.length).length/sp.length*100):null;
  K.kcal=avg(cur.filter(x=>x.kcal).map(x=>x.kcal));K.prot=avg(cur.filter(x=>x.protein).map(x=>x.protein));
  K.strain={Low:0,Moderate:0,High:0};cur.forEach(x=>{if(K.strain[x.strain]!=null)K.strain[x.strain]++});
  const F=[];
  if(cur.length&&pri.length&&K.pain.c-K.pain.p>=2)F.push({t:'Pain rising',m:'Average pain up '+(K.pain.c-K.pain.p).toFixed(1)+' points week on week ('+K.pain.p.toFixed(1)+' → '+K.pain.c.toFixed(1)+').'});
  const hi=cur.filter(x=>x.pain>=6).sort((a,b)=>b.pain-a.pain)[0];
  if(hi){const e=ex(hi.ex),r=e.reg?ex(e.reg):null;F.push({t:'Pain 6/10 or more',m:'Pain '+hi.pain+'/10 on '+e.name+' ('+fmt(hi.d)+').',reg:r})}
  else if(F.length&&F[0].t=='Pain rising'){const lx=cur[cur.length-1],e=ex(lx.ex);F[0].reg=e.reg?ex(e.reg):null}
  if(cur.length&&pri.length&&K.ease.c-K.ease.p>=2){const l1=avg(cur.map(x=>x.load)),l0=avg(pri.map(x=>x.load)),flat=(l1==0&&l0==0)||Math.abs(l1-l0)<=Math.max(l0,l1)*.05+0.01;if(flat)F.push({t:'Fatigue',m:'Effort rose '+(K.ease.c-K.ease.p).toFixed(1)+' points ('+K.ease.p.toFixed(1)+' → '+K.ease.c.toFixed(1)+') while the load stayed flat.'})}
  const pf=cur.filter(x=>x.form<=2||(x.faults&&String(x.faults).length));if(pf.length>=2)F.push({t:'Posture faults',m:pf.length+' sessions with form faults in 7 days'+(pf.some(x=>x.faults)?' ('+[...new Set(pf.map(x=>x.faults).filter(Boolean).join(', ').split(', '))].join(', ')+')':'')+'.'});
  K.flags=F;K.other=alerts(c).filter(a=>!['Pain rising','Form decline'].includes(a[0]));
  return K;
}

   '<div class="sm mute" style="margin:3px 0">'+e.muscles.map(m=>MUSC[m].n.split(' (')[0]).join(', ')+' · '+e.goal+' · '+e.equip+'</div><div class="sm">'+esc(e.cue)+'</div>'+
   '<div class="chips" style="margin-top:8px">'+(e.reg?'<span class="chip" data-sp="jump" data-id="'+e.reg+'">↓ Regression: '+esc(ex(e.reg).name)+' (L'+ex(e.reg).level+')</span>':'<span class="sm mute">Entry level, nothing easier.</span>')+(e.prog?'<span class="chip" data-sp="jump" data-id="'+e.prog+'">↑ Progression: '+esc(ex(e.prog).name)+' (L'+ex(e.prog).level+')</span>':'<span class="sm mute">Top of the ladder.</span>')+'</div>'+
   (c?'<div style="margin-top:8px">'+(c.prog.includes(e.id)?'<span class="pill good">In '+esc(c.name.split(' ')[0])+"'s programme</span>":'<button class="b sm" data-act="addprog" data-id="'+e.id+'">+ Add to '+esc(c.name.split(' ')[0])+"'s programme</button>")+'</div>':'')+'</div>').join('')+(all.length>lim?'<button class="b alt" style="width:100%" data-sp="more">Show more ('+(all.length-lim)+' left)</button>':'');
}
function viewLib(){
  const f=S.lib,opt=(a,v)=>'<option value="">All</option>'+a.map(x=>'<option'+(x==v?' selected':'')+'>'+x+'</option>').join('');
  const u=k=>[...new Set(EXR.map(e=>e[k]))].sort();
  return '<h2>Exercise library</h2><div class="card"><label style="margin-top:0">Prescribe to client</label><select data-lib="cid"><option value="">Browse only</option>'+CLIENTS.map(c=>'<option value="'+c.id+'"'+(f.cid==c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select>'+
  '<div style="margin-top:8px"><button class="b alt sm" data-act="match">Match to client’s region and level</button></div>'+
  '<label>Search name, muscle or equipment</label><input data-lib="q" placeholder="e.g. glutes, barbell, squat" value="'+esc(f.q)+'">'+
  '<div class="grid g3"><div><label>Region</label><select data-lib="region">'+opt(u('region'),f.region)+'</select></div><div><label>Goal</label><select data-lib="goal">'+opt(u('goal'),f.goal)+'</select></div><div><label>Equipment</label><select data-lib="equip">'+opt(u('equip'),f.equip)+'</select></div></div>'+
  '<label>Level</label><div class="chips">'+[0,1,2,3,4,5].map(l=>'<span class="chip'+(f.level==l?' on':'')+'" data-act="lvl" data-id="'+l+'">'+(l?'L'+l:'Any')+'</span>').join('')+'</div></div><div id="libres">'+libList()+'</div>';
}
// ---- events
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-sp]');if(!t)return;const a=t.dataset.sp,id=t.dataset.id,L=S.lg;
  if(a=='pickex'){L.ex=+id;L.q='';render();if($('#lgf'))$('#lgf').scrollIntoView({block:'start'})}
  else if(a=='clearex'){L.ex=null;render()}
  else if(a=='fault'){L.faults=L.faults.includes(id)?L.faults.filter(x=>x!=id):[...L.faults,id];if(L.faults.length&&L.form>2)L.form=2;render()}
  else if(a=='addfood'){const f=CLOUD.foods[+id],x=L.foods.find(y=>y.n==f.n);if(x){x.q++;x.kcal+=f.kcal;x.p+=f.p}else L.foods.push({n:f.n,q:1,kcal:f.kcal,p:f.p});render()}
  else if(a=='rmfood'){L.foods.splice(+id,1);render()}
  else if(a=='supp'){L.supps=L.supps.includes(id)?L.supps.filter(x=>x!=id):[...L.supps,id];render()}
  else if(a=='strain'){L.strain=id;render()}
  else if(a=='jump'){Object.assign(S.lib,{q:ex(+id).name,region:'',goal:'',level:0,equip:'',lim:40});render();scrollTo(0,0)}
  else if(a=='more'){S.lib.lim=(S.lib.lim||40)+40;$('#libres').innerHTML=libList()}
  else if(a=='print'){try{window.print();S.toast='If no print dialog opened, use your browser’s Print or the Copy button';}catch(x){S.toast='Printing is blocked in this viewer. Use Copy, or open the page in a browser.'}render()}
  else if(a=='copyrep'){const txt=reportText(cl(S.sheetCid));const ok=()=>{S.toast='Copied. Paste it into WhatsApp';render()},no=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='width:100%;height:220px';const w=document.createElement('div');w.className='card noprint';w.innerHTML='<b>Select all and copy:</b>';w.appendChild(ta);$('#app').prepend(w);ta.select()};try{navigator.clipboard.writeText(txt).then(ok,no)}catch(x){no()}}
});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.lg;
  if(k){const L=S.lg;L[k]=e.target.type=='checkbox'?e.target.checked:(['notes'].includes(k)?e.target.value:+e.target.value);const v=$('#lg_'+k);if(v)v.textContent=e.target.value;return}
  if(e.target.id=='lgq'){S.lg.q=e.target.value;$('#exres').innerHTML=exPick()}
  else if(e.target.id=='lgf_q'){S.lg.fq=e.target.value;$('#fdres').innerHTML=foodPick()}
});
document.addEventListener('change',e=>{
  if(e.target.id=='lgcid'){S.lg.cid=+e.target.value;S.logcid=S.lg.cid}
  const k=e.target.dataset&&e.target.dataset.lg;if(k=='form'||k=='met'){S.lg[k]=e.target.type=='checkbox'?e.target.checked:+e.target.value}
});
document.addEventListener('submit',e=>{
  const f=e.target;if(f.id!='lgf'&&f.id!='addf')return;e.preventDefault();e.stopImmediatePropagation();
  if(f.id=='lgf'){submitLog();return}
  const v=Object.fromEntries(new FormData(f)),id=Math.max(1000,...CLIENTS.map(c=>c.id))+1;
  const c=mkCloudClient({id_local:id,cid:null,name:v.name,age:v.age,goal:v.cond,region:v.region,level:v.level,physio:v.physio,pending:true},0);c.id=id;CLIENTS.push(c);
  const row={name:v.name,age:+v.age,goal:v.cond,region:v.region,level:+v.level,physio:v.physio||null};
  pushQ({kind:'client',lid:id,row}).then(ok=>{setState(ok?'synced':'offline',CLOUD.err);S.toast=ok?'Client saved to the cloud':'Client saved on this device, will sync when online';render()});
  S.adding=false;S.toast='Client added';go('clients',{cid:id});
},true);


// ---- Member View: legend, rings, target muscles, steppers
function legend(){return '<div class="legend">'+[['red','Trained today'],['amber','Trained yesterday'],['green','Recovered'],['slate','Not trained lately'],['pain','High pain (pulses)']].map(x=>'<span><i style="background:rgb('+HEAT[x[0]].map(v=>Math.round(v*255))+')"></i>'+x[1]+'</span>').join('')+'<span><i style="background:rgb(0,230,255)"></i>Selected</span></div>'}
function ringSvg(p,col,mid,sub){const R=30,C=2*Math.PI*R,f=clamp(p,0,1);return '<svg viewBox="0 0 80 80" width="92" height="92" role="img" aria-label="'+esc(sub)+'"><circle cx="40" cy="40" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="40" cy="40" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+(C*f).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 40 40)"/><text x="40" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">'+mid+'</text></svg>'}
function ringsCard(c){
  if(!c)return '';mkEmpty(c);
  const days=new Set(c.s.map(x=>x.d));let streak=0,d=days.has(NOW)?NOW:NOW-1;while(days.has(d)){streak++;d--}
  let wk=0;for(let i=0;i<7;i++)if(days.has(NOW-i))wk++;
  const prot=foodTot(c).p+c.s.filter(x=>x.d==NOW).reduce((a,x)=>a+(x.protein||0),0),pt=protTarget(c),dr=dayRec(c,NOW),steps=dr?dr.steps:0;
  return '<div class="card"><div class="rings">'+
   '<div class="rg" data-w="goT" data-id="body">'+ringSvg(wk/4,'#ff9f1c',streak+'d',streak+' day streak, '+wk+' of 4 sessions this week')+'<div class="rl"><b>Workout streak</b><br>'+wk+'/4 this week</div></div>'+
   '<div class="rg" data-w="go" data-id="diet">'+ringSvg(prot/pt,'#22c58b',Math.round(prot/pt*100)+'%','Protein '+Math.round(prot)+' of '+pt+' g')+'<div class="rl"><b>Protein goal</b><br>'+Math.round(prot)+'/'+pt+' g</div></div>'+
   '<div class="rg" data-w="go" data-id="daily">'+ringSvg(steps/7000,'#00d4ff',steps?(steps>=1000?(steps/1000).toFixed(1)+'k':steps):'–','Steps '+steps)+'<div class="rl"><b>Daily movement</b><br>'+(steps?steps.toLocaleString()+' / 7,000':'add steps')+'</div></div></div></div>';
}
function targetMuscles(c){
  const H=heatMap(c),prog=new Set((c.prog||[]).map(id=>ex(id)&&ex(id).muscles[0]));
  return Object.keys(MUSC).filter(m=>H[m].st=='green'||H[m].st=='slate').map(m=>{
    const gap=H[m].last==null?10:Math.min(H[m].last,10),reg=EXR.some(e=>e.muscles[0]==m&&e.region==c.region);
    const pool=EXR.filter(e=>e.muscles[0]==m),pr=(c.prog||[]).map(ex).find(e=>e&&e.muscles[0]==m);
    const rec=pr||pool.filter(e=>e.level<=c.level+1).sort((a,b)=>Math.abs(a.level-c.level)-Math.abs(b.level-c.level))[0]||pool[0];
    return{m,score:gap+(prog.has(m)?4:0)+(reg?2:0),h:H[m],rec}}).filter(x=>x.rec).sort((a,b)=>b.score-a.score).slice(0,3);
}
function targetsCard(){
  const c=cl(S.me);if(!c)return '';const T=targetMuscles(c),H=heatMap(c),hurt=Object.keys(H).filter(m=>H[m].st=='pain'),tired=Object.keys(H).filter(m=>H[m].st=='red'||H[m].st=='amber');
  const nm=m=>MUSC[m].n.split(' (')[0];
  return '<div class="card"><h3>Today’s target muscles</h3>'+(T.length?T.map(x=>'<div class="tgt"><i style="background:rgb('+HEAT[x.h.st].map(v=>Math.round(v*255))+')"></i><div style="flex:1"><b>'+nm(x.m)+'</b><div class="sm mute">'+(x.h.last==null?'Not trained lately':'Rested '+x.h.last+' days')+' · try '+esc(x.rec.name)+' (L'+x.rec.level+')</div></div><button class="b sm" data-sp="start" data-id="'+x.m+'" data-ex="'+x.rec.id+'">Start</button></div>').join(''):'<div class="sm mute">Log a session to get suggestions.</div>')+
   (hurt.length?'<div class="tip" style="margin-top:8px;background:var(--badbg);color:var(--bad)">Go easy: '+hurt.map(nm).join(', ')+' (pain 6 or more logged this week).</div>':'')+(tired.length?'<div class="sm mute" style="margin-top:6px">Still recovering: '+tired.map(nm).join(', ')+'.</div>':'')+'</div>';
}
function stepper(k,v,step,min){return '<div class="stp"><button type="button" data-st="'+k+'" data-d="-'+step+'" data-min="'+min+'" aria-label="Decrease '+k+'">−</button><b id="stv_'+k+'">'+v+'</b><button type="button" data-st="'+k+'" data-d="'+step+'" data-min="'+min+'" aria-label="Increase '+k+'">+</button></div>'}
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-st]');if(s){const k=s.dataset.st,B=BODY,nv=Math.max(+s.dataset.min,Math.round(((+B.f[k]||0)+ +s.dataset.d)*10)/10);B.f[k]=nv;const v=$('#stv_'+k);if(v)v.textContent=nv;if(navigator.vibrate)try{navigator.vibrate(8)}catch(x){}return}
  const t=e.target.closest('[data-sp=start]');if(t){BODY.cid=S.me;selectMuscle(t.dataset.id);pickEx(+t.dataset.ex);try{$('#bpanel').scrollIntoView({behavior:'smooth',block:'start'})}catch(x){}}
});

if(typeof document!=='undefined'&&document.getElementById('app'))sbInit();
</script></body></html>
